packages:
  - apps/*
  - packages/*

catalog:
  typescript: ~6.0.3
  "@types/node": ^24.0.0
  tsx: ^4.23.0
  prisma: ^7.10.0
  "@prisma/client": ^7.10.0
  "@prisma/adapter-mariadb": ^7.10.0
  bullmq: ^6.3.0
  ioredis: ^6.0.0
  zod: ^4.6.0

# pnpm 12 bloque les scripts d'installation des dépendances non listées ici
allowBuilds:
  "@prisma/engines": true
  prisma: true
  esbuild: true
  msgpackr-extract: true
  sharp: false
  unrs-resolver: false