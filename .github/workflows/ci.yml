name: CI

on:
  pull_request:
  push:
    branches: [main]

# Un nouveau push sur la même branche annule le run encore en cours
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7

      # Sans « version », l'action lit packageManager dans package.json (pnpm@12.10.1)
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Installation
        run: pnpm install --frozen-lockfile

      # Le client Prisma n'est pas commité : il faut le générer avant de vérifier les types
      - name: Client Prisma
        run: pnpm --filter @phenix/database generate

      - name: Lint
        run: pnpm lint

      - name: Types
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build

  images:
    name: Images Docker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Une seule étape « build » du Dockerfile pour les quatre cibles : le builder la garde en cache
      - name: Image migrate
        uses: docker/build-push-action@v7
        with:
          context: .
          target: migrate
          outputs: type=cacheonly
          cache-from: type=gha,scope=phenix
          cache-to: type=gha,scope=phenix,mode=max

      - name: Image bot
        uses: docker/build-push-action@v7
        with:
          context: .
          target: bot
          outputs: type=cacheonly
          cache-from: type=gha,scope=phenix

      - name: Image api
        uses: docker/build-push-action@v7
        with:
          context: .
          target: api
          outputs: type=cacheonly
          cache-from: type=gha,scope=phenix

      - name: Image web
        uses: docker/build-push-action@v7
        with:
          context: .
          target: web
          outputs: type=cacheonly
          cache-from: type=gha,scope=phenix

      - name: Image backup
        uses: docker/build-push-action@v7
        with:
          context: docker/backup
          outputs: type=cacheonly
          cache-from: type=gha,scope=backup
          cache-to: type=gha,scope=backup,mode=max